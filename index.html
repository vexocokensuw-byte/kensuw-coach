<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KENSUW AI COACH - PUBG Mobile IGL & Taktik Koçu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background-color: #000000; color: #ffffff; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }

        .app-container { width: 100vw; height: 100vh; max-width: 1000px; display: flex; flex-direction: column; background-color: #0a0a0a; border-left: 1px solid #1a1a1a; border-right: 1px solid #1a1a1a; }

        .header { display: flex; align-items: center; justify-content: space-between; padding: 18px 24px; background-color: #050505; border-bottom: 1px solid #222222; }
        .logo-box { display: flex; align-items: center; gap: 14px; }
        .logo-icon { width: 42px; height: 42px; background: #ffffff; color: #000000; font-weight: 900; font-size: 22px; display: flex; align-items: center; justify-content: center; border-radius: 8px; clip-path: polygon(0 0, 100% 0, 85% 100%, 0 100%); }
        .brand-text h1 { font-size: 18px; font-weight: 800; letter-spacing: 1.5px; color: #ffffff; text-transform: uppercase; }
        .brand-text span { font-size: 12px; color: #888888; font-weight: 500; }
        .status-badge { background: #181818; border: 1px solid #333333; color: #ffffff; font-size: 12px; padding: 6px 12px; border-radius: 20px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .status-dot { width: 8px; height: 8px; background-color: #ffffff; border-radius: 50%; box-shadow: 0 0 8px #ffffff; }

        .chat-container { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; background-color: #0a0a0a; }
        .message { display: flex; width: 100%; }
        .ai-message { align-self: flex-start; }
        .user-message { align-self: flex-end; justify-content: flex-end; }
        .message-content { padding: 16px 20px; border-radius: 12px; font-size: 15px; line-height: 1.6; max-width: 80%; }
        
        .ai-message .message-content { background-color: #121212; border: 1px solid #262626; color: #e5e5e5; border-top-left-radius: 2px; }
        .user-message .message-content { background-color: #ffffff; color: #000000; font-weight: 600; border-top-right-radius: 2px; }

        .quick-prompts { display: flex; gap: 10px; padding: 10px 24px; overflow-x: auto; background-color: #050505; border-top: 1px solid #1a1a1a; }
        .prompt-btn { background: #111111; color: #aaaaaa; border: 1px solid #262626; padding: 8px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; white-space: nowrap; font-weight: 500; }
        .prompt-btn:hover { background: #ffffff; color: #000000; border-color: #ffffff; }

        .input-container { padding: 18px 24px; background-color: #050505; border-top: 1px solid #222222; display: flex; gap: 12px; align-items: center; }
        .input-container input { flex: 1; background-color: #121212; border: 1px solid #2a2a2a; padding: 14px 20px; border-radius: 8px; color: #ffffff; outline: none; font-size: 15px; }
        .input-container input:focus { border-color: #ffffff; }
        .input-container button { width: 48px; height: 48px; background-color: #ffffff; border: none; border-radius: 8px; color: #000000; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; }

        @media (max-width: 768px) {
            .brand-text span { display: none; }
            .header, .chat-container, .input-container { padding: 14px; }
            .message-content { max-width: 90%; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="logo-box">
                <div class="logo-icon">K</div>
                <div class="brand-text">
                    <h1>KENSUW AI COACH</h1>
                    <span>PUBG MOBILE IGL & TAKTİK ANALİZ MERKEZİ</span>
                </div>
            </div>
            <div class="status-badge">
                <div class="status-dot"></div>
                <span>SİSTEM AKTİF</span>
            </div>
        </div>

        <div class="chat-container" id="chatMessages">
            <div class="message ai-message">
                <div class="message-content">
                    📌 <strong>[IGL & KOÇ ANALİZ MERKEZİ]</strong><br><br>
                    Merhaba IGL! Takımının scrim/turnuva maçlarındaki rotasyon hatalarını, drop bölgesi split'lerini veya erken çatışma sorunlarını analiz etmeye hazırım. Sorunu aşağıya yazabilirsin!
                </div>
            </div>
        </div>

        <div class="quick-prompts">
            <button class="prompt-btn" onclick="sendQuickPrompt('Erangel Pochinki main drop için en iyi split taktiği nedir?')">📍 Pochinki Split</button>
            <button class="prompt-btn" onclick="sendQuickPrompt('Phase 3 köprü geçişinde pusuya düşmemek için ne yapmalıyız?')">🚗 Köprü Geçişi</button>
            <button class="prompt-btn" onclick="sendQuickPrompt('Miramar Pecado erken fight kayıplarını önlemek için IGL komutu nasıl olmalı?')">🏜 Pecado Early Fight</button>
            <button class="prompt-btn" onclick="sendQuickPrompt('Alan daralırken araç koruması ve kompozisyon kurma stratejisi ver.')">🛡️ Araç Koruma</button>
        </div>

        <div class="input-container">
            <input type="text" id="userInput" placeholder="Taktik sorusu veya scrim hatası yazın..." autocomplete="off">
            <button id="sendBtn" onclick="handleSend()">
                <i class="fa-solid fa-arrow-up"></i>
            </button>
        </div>
    </div>

    <script>
        function handleSend() {
            const userInput = document.getElementById("userInput");
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, "user");
            userInput.value = "";

            setTimeout(() => {
                const aiResponse = generateCoachResponse(text);
                addMessage(aiResponse, "ai");
            }, 400);
        }

        function addMessage(text, sender) {
            const chatMessages = document.getElementById("chatMessages");
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${sender === 'user' ? 'user-message' : 'ai-message'}`;
            
            const formattedText = text.replace(/\n/g, "<br>");
            msgDiv.innerHTML = `<div class="message-content">${sender === 'ai' ? '<strong>KENSUW COACH:</strong><br><br>' : ''}${formattedText}</div>`;
            
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function sendQuickPrompt(promptText) {
            document.getElementById("userInput").value = promptText;
            handleSend();
        }

        document.getElementById("userInput").addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                e.preventDefault();
                handleSend();
            }
        });

        function generateCoachResponse(query) {
            const q = query.toLowerCase();
            if (q.includes("pochinki")) {
                return "📌 **POCHINKI SPLIT TAKTİĞİ:**\n1. **2-2 Split Düzeni:** Takımın iki oyuncusu Kilise bölgesini (yüksek nokta görüşü için), diğer iki oyuncusu Mavi Evler tarafını tutmalı.\n2. **Rotasyon:** İlk çember kapandığında Kilise grubu görüş açısı verip araçları toplarken, Mavi Evler grubu ana yoldan batıya doğru açılmalıdır.";
            } else if (q.includes("köprü") || q.includes("kopru")) {
                return "🚗 **KÖPRÜ GEÇİŞ STRATEJİSİ:**\n1. **Scout (Öncü) Atama:** Köprüye asla 4 kişi birden girmeyin. Bir kişi hızlı motor/buggy ile pusu kontrolü yapmalıdır.\n2. **Bot Geçişi:** Köprü tutulmuşsa vakit kaybetmeden deniz kenarından tekne/bot arayışına geçilmeli ya da doğu kanadındaki sudan yüzme hatları kullanılmalıdır.";
            } else if (q.includes("pecado")) {
                return "🏜️ **PECADO EARLY FIGHT KURALI:**\n1. **Casino & Arena İzolasyonu:** Asla aynı anda hem Casino hem Arena'ya bölünmeyin. Tüm takım Casino merkezli düşüp çatı alanını kapatmalıdır.\n2. **IGL Komutu:** İlk silah alındığı an bireysel fight yerine doğrudan çatı üstünden 4'lü baskı kurulmalıdır.";
            } else {
                return "📌 **IGL & KOÇ DERSİ:**\n\n1. **Araç Koruma:** Maç ortasına 4 araçla girmek alan içi siper ve hayatta kalma şansınızı %60 artırır.\n2. **Alan İçi Disiplin:** Çember kapanırken gereksiz skor arayışına girmeyin, puan odaklı alan merkezine sızın.\n3. **Komuta Zinciri:** Çatışma anında IGL tek bir hedef gösterdiği an tüm takım aynı hedefe odaklanmalıdır.";
            }
        }
    </script>
</body>
</html>

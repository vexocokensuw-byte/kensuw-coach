<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KENSUW AI COACH</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container" id="appContainer">
        <!-- SOL PANEL: HARİTA VE ARAÇLAR -->
        <div class="map-section" id="mapSection">
            <!-- ÜST BAR: MAP SEÇİMİ VE MOBİL KAPATMA -->
            <div class="map-header">
                <div class="map-selector">
                    <button class="map-btn active" data-map="erangel">Erangel</button>
                    <button class="map-btn" data-map="miramar">Miramar</button>
                    <button class="map-btn" data-map="rondo">Rondo</button>
                </div>
                <button class="mobile-map-close" id="mobileMapCloseBtn" title="Haritayı Kapat">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- HARİTA GÖRÜNTÜSÜ VE CANVAS -->
            <div class="map-display-container" id="mapDisplayContainer">
                <div class="map-wrapper" id="mapWrapper">
                    <img src="https://images.unsplash.com/photo-1524661135-423995f22d0b?q=80&w=1000&auto=format&fit=crop" id="currentMapImg" alt="PUBG Haritası">
                    <canvas id="drawingCanvas"></canvas>
                    <!-- Şehir Noktaları Overlay -->
                    <div id="cityOverlay"></div>
                </div>
            </div>

            <!-- ALT BAR: ŞEHİR BİLGİ VE KALEM ARAÇLARI -->
            <div class="map-controls">
                <div class="control-group">
                    <button class="tool-btn toggle-btn" id="cityInfoToggleBtn">
                        <i class="fa-solid fa-city"></i> Şehir Bilgi
                        <span class="status-badge" id="cityBadge">Kapat</span>
                    </button>
                </div>

                <div class="control-group">
                    <button class="tool-btn toggle-btn" id="pencilToggleBtn">
                        <i class="fa-solid fa-pen"></i> Kalem
                        <span class="status-badge" id="pencilBadge">Kapat</span>
                    </button>
                    <div class="pen-settings" id="penSettings">
                        <span class="color-picker red active" data-color="#ff3b30"></span>
                        <span class="color-picker green" data-color="#34c759"></span>
                        <span class="color-picker blue" data-color="#007aff"></span>
                        <select id="penThickness">
                            <option value="2">İnce</option>
                            <option value="5" selected>Orta</option>
                            <option value="9">Kalın</option>
                        </select>
                        <button class="tool-btn-sm" id="clearCanvasBtn" title="Çizimleri Temizle">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- PANELS ARASI GENİŞLETME / DARALTMA BUTONU (MASAÜSTÜ) -->
            <button class="resize-handle" id="resizeHandle" title="Paneli Genişlet/Daralt">
                <i class="fa-solid fa-arrows-left-right" id="resizeIcon"></i>
            </button>
        </div>

        <!-- SAĞ PANEL: YAZI / CEVAP / CHAT AREA -->
        <div class="chat-section">
            <div class="chat-header">
                <h2>KENSUW AI COACH</h2>
                <p>PUBG Mobile Analiz & Yapay Zeka Koçu</p>
            </div>

            <!-- MOBİL İÇİN HARİTA AÇMA BUTONU -->
            <div class="mobile-map-trigger-container">
                <button class="mobile-map-open-btn" id="mobileMapOpenBtn">
                    <i class="fa-solid fa-map-location-dot"></i> Harita Aç
                </button>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="message ai-message">
                    <div class="message-content">
                        <strong>Cevap Başlığı</strong>
                        <p>Merhaba! Ben KENSUW AI Coach. Haritadan bir bölge seçebilir, çizim araçlarıyla strateji belirleyebilir veya aklına takılan PUBG Mobile sorularını bana sorabilirsin!</p>
                    </div>
                </div>
            </div>

            <div class="chat-input-area">
                <input type="text" id="userInput" placeholder="Soru Sorma Kutucuğu..." autocomplete="off">
                <button id="sendBtn" title="Gönder">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- ŞEHİR BİLGİ MODALI -->
    <div class="modal" id="cityModal">
        <div class="modal-content">
            <span class="modal-close" id="modalClose">&times;</span>
            <h3 id="modalTitle">Şehir Detayı</h3>
            <p id="modalDescription">Yükleniyor...</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
